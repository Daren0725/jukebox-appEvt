<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJ Console — SAP Jukebox</title>
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        :root {
            --navy:   #1a1a6e;
            --pink:   #d620b0;
            --purple: #4a1ddb;
            --glass:  rgba(255,255,255,0.65);
            --border: rgba(180,180,230,0.4);
        }

        body {
            background: linear-gradient(135deg, #dde8fc 0%, #ede8ff 45%, #fce4f8 100%);
            color: var(--navy);
            font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 24px;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(100,80,255,.12) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 20%, rgba(220,32,176,.08) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }

        .wrap { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

        /* Header */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
        }
        .title {
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 800; letter-spacing: .08em;
            color: var(--navy);
        }
        .title span { color: var(--pink); }
        .stats { display: flex; gap: 10px; }
        .stat {
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 20px; padding: 6px 16px;
            font-size: .82rem; color: rgba(26,26,110,.65);
            backdrop-filter: blur(10px);
        }
        .stat strong { color: var(--navy); font-family: 'Courier New', monospace; }

        /* Sync badge */
        #syncBadge {
            font-size: .72rem; padding: 5px 14px;
            border-radius: 20px; border: 1px solid rgba(74,29,219,.3);
            color: rgba(74,29,219,.8); background: rgba(74,29,219,.07);
            transition: all .5s;
        }
        #syncBadge.live { color: rgba(0,160,120,.9); background: rgba(0,160,120,.08); border-color: rgba(0,160,120,.3); }
        #syncBadge.connecting { color: rgba(74,29,219,.7); background: rgba(74,29,219,.07); border-color: rgba(74,29,219,.25); }

        /* Now Playing */
        .now-playing {
            background: linear-gradient(135deg, rgba(26,26,110,.88), rgba(58,28,219,.92));
            border-radius: 18px; padding: 22px 26px;
            display: flex; align-items: center; gap: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(26,26,110,.2);
        }
        .vinyl {
            width: 64px; height: 64px; flex-shrink: 0;
            border-radius: 50%;
            background: conic-gradient(#1a1a2e 0deg,#16213e 45deg,#2a2a6e 90deg,#1a1a2e 135deg,#16213e 180deg,#2a2a6e 225deg,#1a1a2e 270deg,#16213e 315deg,#1a1a2e 360deg);
            position: relative;
            animation: spin 3s linear infinite;
            box-shadow: 0 0 24px rgba(214,32,176,.5);
        }
        .vinyl::after {
            content: ''; position: absolute; inset: 50%; transform: translate(-50%,-50%);
            width: 18px; height: 18px; border-radius: 50%;
            background: radial-gradient(circle, var(--pink), var(--purple));
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .now-playing-info { flex: 1; min-width: 0; }
        .np-tag { font-size: .65rem; letter-spacing: .3em; color: rgba(214,32,176,.9); text-transform: uppercase; margin-bottom: 6px; }
        .np-song { font-size: clamp(1.1rem, 2.5vw, 1.6rem); font-weight: 700; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .np-artist { font-size: .9rem; color: rgba(255,255,255,.65); margin-top: 4px; }
        .np-empty { color: rgba(255,255,255,.4); font-style: italic; font-size: .9rem; }

        /* Queue header */
        .queue-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px;
        }
        .queue-title { font-size: .8rem; letter-spacing: .22em; text-transform: uppercase; color: rgba(26,26,110,.55); display: flex; align-items: center; gap: 8px; }
        .queue-title::before { content: ''; display: block; width: 18px; height: 2px; background: linear-gradient(90deg, var(--pink), var(--purple)); border-radius: 2px; }

        /* Song rows */
        .song-list { list-style: none; }
        .song-row {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 18px; margin-bottom: 10px;
            background: var(--glass); border: 1px solid var(--border);
            border-radius: 14px; backdrop-filter: blur(12px);
            transition: all .25s;
        }
        .song-row.playing {
            background: rgba(214,32,176,.07);
            border-color: rgba(214,32,176,.4);
            box-shadow: 0 4px 20px rgba(214,32,176,.1);
        }
        .num { font-family: 'Courier New', monospace; font-size: .72rem; color: rgba(26,26,110,.3); min-width: 28px; }
        .info { flex: 1; min-width: 0; }
        .song-name { font-weight: 700; font-size: .95rem; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .artist-name { font-size: .78rem; color: rgba(26,26,110,.55); margin-top: 2px; }
        .playing-badge {
            background: rgba(214,32,176,.12); border: 1px solid rgba(214,32,176,.4);
            border-radius: 8px; padding: 4px 10px;
            font-size: .68rem; color: var(--pink); letter-spacing: .1em; flex-shrink: 0;
        }
        .actions { display: flex; gap: 8px; flex-shrink: 0; }
        .btn {
            padding: 8px 14px; border-radius: 10px; cursor: pointer;
            font-size: .78rem; font-weight: 600; transition: all .2s;
            border: none;
        }
        .btn-play {
            background: rgba(214,32,176,.1); border: 1px solid rgba(214,32,176,.35);
            color: var(--pink);
        }
        .btn-play:hover { background: rgba(214,32,176,.22); }
        .btn-done {
            background: var(--navy); color: white;
        }
        .btn-done:hover { background: rgba(26,26,110,.8); }
        .btn-del {
            background: rgba(220,50,50,.08); border: 1px solid rgba(220,50,50,.22);
            color: rgba(200,40,40,.7);
        }
        .btn-del:hover { background: rgba(220,50,50,.18); color: #c82828; }

        .empty-msg { text-align: center; padding: 50px; color: rgba(26,26,110,.3); font-size: .9rem; }

        /* Clear button */
        .btn-clear {
            margin-top: 16px; padding: 9px 18px;
            background: rgba(220,50,50,.07); border: 1px solid rgba(220,50,50,.22);
            border-radius: 10px; color: rgba(200,40,40,.65);
            font-size: .78rem; cursor: pointer; transition: all .2s;
        }
        .btn-clear:hover { background: rgba(220,50,50,.15); color: #c82828; }

        footer { text-align: center; padding: 24px 0 8px; color: rgba(26,26,110,.3); font-size: .72rem; letter-spacing: .18em; }
    </style>
</head>
<body>
<div class="wrap">

    <div class="header">
        <div class="title">&#9835; DJ Console <span>| SAP Jukebox</span></div>
        <div class="stats">
            <div class="stat">Queued <strong id="statQ">0</strong></div>
            <div class="stat">Done <strong id="statD">0</strong></div>
            <span id="syncBadge">&#9679; Connecting…</span>
        </div>
    </div>

    <!-- Now Playing -->
    <div class="now-playing">
        <div class="vinyl" id="djVinyl"></div>
        <div class="now-playing-info">
            <div class="np-tag">&#9654; Now Playing</div>
            <div id="npContent"><div class="np-empty">Nothing playing yet — hit Play on a song below</div></div>
        </div>
    </div>

    <!-- Queue -->
    <div class="queue-header">
        <div class="queue-title">Song Queue</div>
    </div>
    <ul class="song-list" id="songList">
        <li class="empty-msg">Waiting for song requests…</li>
    </ul>
    <button class="btn-clear" onclick="clearAll()">&#128465; Clear all songs</button>

</div>
<footer>SAP Discovery Showroom &nbsp;·&nbsp; DJ View</footer>

<script>
    /* ═══════════════════════════════
       FIREBASE CONFIG  (same as index.html)
    ═══════════════════════════════ */
    var FIREBASE_CFG = {
        apiKey:      'AIzaSyCweHck9vfaGyYUszJ44TuNFjsrcm76nIw',
        databaseURL: 'https://jukebox-appreciation-event-default-rtdb.europe-west1.firebasedatabase.app'
    };

    /* ═══════════════════════════════
       STATE
    ═══════════════════════════════ */
    var songs  = [];
    var fbReady = false;
    var pollTimer = null;

    /* ═══════════════════════════════
       SYNC STATUS
    ═══════════════════════════════ */
    function setSyncStatus(state) {
        var el = document.getElementById('syncBadge');
        if (!el) return;
        el.className = state;
        if      (state === 'live')        el.textContent = '\u25cf Live Sync';
        else if (state === 'connecting')  el.textContent = '\u25cf Connecting\u2026';
        else if (state === 'local')       el.textContent = '\u25cf Local only';
        else                              el.textContent = '\u25cf Offline';
    }

    /* ═══════════════════════════════
       LOCALSTORAGE HELPERS
    ═══════════════════════════════ */
    function readLocal() {
        try {
            var raw = localStorage.getItem('jukebox');
            if (raw) {
                var data = JSON.parse(raw);
                /* index.html stores an array; Firebase mirror stores an object */
                songs = Array.isArray(data)
                    ? data.slice().sort(function(a,b){ return a.ts - b.ts; })
                    : (data && typeof data === 'object'
                        ? Object.values(data).sort(function(a,b){ return a.ts - b.ts; })
                        : []);
            }
        } catch(e) {}
        setSyncStatus('local');
        render();
    }

    function writeLocal() {
        try { localStorage.setItem('jukebox', JSON.stringify(songs)); } catch(e) {}
    }

    /* ═══════════════════════════════
       FIREBASE REST API
    ═══════════════════════════════ */
    function persist() {
        if (!FIREBASE_CFG.databaseURL) { writeLocal(); return; }
        var obj = {};
        songs.forEach(function(s) { obj[s.id] = s; });
        fetch(FIREBASE_CFG.databaseURL + '/jukebox/songs.json', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(obj)
        }).catch(function(e) {
            console.warn('Write error', e);
            writeLocal(); /* fallback: mirror to localStorage */
        });
        writeLocal(); /* always keep localStorage in sync for same-browser tab */
    }

    function pollFirebase() {
        if (!FIREBASE_CFG.databaseURL) { readLocal(); return; }
        fetch(FIREBASE_CFG.databaseURL + '/jukebox/songs.json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data && typeof data === 'object' && !Array.isArray(data)) {
                    /* Firebase has songs — use them */
                    songs = Object.values(data).sort(function(a,b){ return a.ts - b.ts; });
                    fbReady = true;
                    setSyncStatus('live');
                    render();
                } else {
                    /* Firebase empty — fall back to localStorage */
                    fbReady = true;
                    setSyncStatus('live');
                    readLocal();
                }
            })
            .catch(function() {
                setSyncStatus('connecting');
                readLocal(); /* Firebase unreachable — show localStorage songs */
            });
    }

    function initFirebase() {
        /* BroadcastChannel: picks up real-time updates from index.html same-browser */
        try {
            if (typeof BroadcastChannel !== 'undefined') {
                var bc = new BroadcastChannel('jukebox');
                bc.onmessage = function(e) {
                    if (!fbReady && Array.isArray(e.data)) { songs = e.data; render(); }
                };
            }
        } catch(e) {}

        pollFirebase();
        pollTimer = setInterval(pollFirebase, 2500);
    }

    /* ═══════════════════════════════
       RENDER
    ═══════════════════════════════ */
    function render() {
        var active  = songs.filter(function(s){ return s.status !== 'done'; });
        var playing = null;
        for (var i = 0; i < songs.length; i++) {
            if (songs[i].status === 'playing') { playing = songs[i]; break; }
        }
        var doneCount = songs.filter(function(s){ return s.status === 'done'; }).length;

        document.getElementById('statQ').textContent = active.filter(function(s){ return s.status === 'queued'; }).length;
        document.getElementById('statD').textContent = doneCount;

        /* Now Playing */
        var npEl = document.getElementById('npContent');
        if (playing) {
            npEl.innerHTML =
                '<div class="np-song">' + esc(playing.song) + '</div>' +
                '<div class="np-artist">' + esc(playing.artist) + '</div>';
            document.getElementById('djVinyl').style.animationDuration = '1.5s';
        } else {
            npEl.innerHTML = '<div class="np-empty">Nothing playing yet \u2014 hit Play on a song below</div>';
            document.getElementById('djVinyl').style.animationDuration = '4s';
        }

        /* Queue */
        var ul = document.getElementById('songList');
        if (!active.length) {
            ul.innerHTML = '<li class="empty-msg">Queue is empty \u2014 waiting for requests \u266a</li>';
            return;
        }
        ul.innerHTML = '';
        active.forEach(function(s, i) {
            var li = document.createElement('li');
            li.className = 'song-row' + (s.status === 'playing' ? ' playing' : '');
            var badge   = s.status === 'playing' ? '<span class="playing-badge">\u25ba PLAYING</span>' : '';
            var playBtn = s.status !== 'playing'
                ? '<button class="btn btn-play" onclick="setPlay(' + s.id + ')">\u25ba Play</button>'
                : '';
            li.innerHTML =
                '<span class="num">' + pad(i + 1) + '</span>' +
                '<div class="info">' +
                    '<div class="song-name">' + esc(s.song) + '</div>' +
                    '<div class="artist-name">' + esc(s.artist) + '</div>' +
                '</div>' +
                badge +
                '<div class="actions">' +
                    playBtn +
                    '<button class="btn btn-done" onclick="markDone(' + s.id + ')">\u2713 Done</button>' +
                    '<button class="btn btn-del"  onclick="removeSong(' + s.id + ')">\u2715</button>' +
                '</div>';
            ul.appendChild(li);
        });
    }

    /* ═══════════════════════════════
       ACTIONS
    ═══════════════════════════════ */
    function setPlay(id) {
        songs = songs.map(function(s) {
            return Object.assign({}, s, {
                status: s.id === id ? 'playing' : (s.status === 'playing' ? 'queued' : s.status)
            });
        });
        persist(); render();
    }
    function markDone(id) {
        songs = songs.map(function(s) {
            return s.id === id ? Object.assign({}, s, {status: 'done'}) : s;
        });
        persist(); render();
    }
    function removeSong(id) {
        songs = songs.filter(function(s){ return s.id !== id; });
        persist(); render();
    }
    function clearAll() {
        if (!confirm('Clear all songs from the queue?')) return;
        songs = []; persist(); render();
    }

    /* ═══════════════════════════════
       UTILS
    ═══════════════════════════════ */
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function pad(n) { return String(n).padStart(2, '0'); }

    /* ═══════════════════════════════
       INIT
    ═══════════════════════════════ */
    initFirebase();
</script>
</body>
</html>
