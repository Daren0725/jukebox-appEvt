<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Discover SAP – Spinning Wheel</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    :root {
      --primary:  #4a70c8;
      --navy:     #1a3070;
      --subtext:  #5a7090;
      --bg:       #e8f0f8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "72", "SAP72", Arial, sans-serif;
      background: linear-gradient(160deg, #dce8f5 0%, #e8f0fa 55%, #f0ebf8 100%);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      color: var(--navy);
    }

    header {
      text-align: center;
      margin-bottom: 8px;
    }
    header .label {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--subtext);
      margin-bottom: 6px;
    }
    header h1 {
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 800;
      color: var(--navy);
    }
    header h1 span { color: var(--primary); }

    /* ── Steps bar (horizontal, always visible below header) ── */
    .steps-bar {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 4px 16px;
      flex-shrink: 0;
    }
    .steps-bar .step { font-size: 11px; padding: 4px 10px; }
    .step {
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(74,112,200,0.2);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(74,112,200,0.08);
    }
    .step .num {
      background: var(--primary);
      color: #fff;
      border-radius: 50%;
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700;
      flex-shrink: 0;
    }

    /* ── Main layout: starts centered, splits after spin ── */
    .main-layout {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 0;
      overflow: hidden;
      transition: gap .5s ease;
    }

    /* Wheel column — always visible, centered initially */
    .wheel-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    /* Result column — hidden initially, slides in after spin */
    .result-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 0;
      min-width: 0;
      overflow: hidden;
      opacity: 0;
      flex-shrink: 0;
      transition: width .55s cubic-bezier(.34,1.1,.64,1),
                  opacity .4s .15s ease;
    }
    .result-col > * { min-width: 400px; }

    /* Triggered by JS when result-card gets .visible */
    .main-layout.revealed {
      gap: 28px;
    }
    .main-layout.revealed .result-col {
      width: 420px;
      opacity: 1;
      overflow: visible;
    }

    .wheel-wrapper {
      position: relative;
      width: min(500px, 58vh);
      height: min(500px, 58vh);
    }

    canvas#wheel {
      position: relative;
      z-index: 1;
      border-radius: 50%;
      display: block;
      width: 100%; height: 100%;
    }

    /* Pointer */
    .pointer {
      position: absolute;
      top: 50%;
      right: -18px;
      transform: translateY(-50%);
      z-index: 10;
      width: 0; height: 0;
      border-top: 18px solid transparent;
      border-bottom: 18px solid transparent;
      border-right: 38px solid #2a40a0;
      filter: drop-shadow(2px 0 6px rgba(42,64,160,0.5));
    }

    /* Center hub */
    .hub {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      width: 54px; height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle, #2a40a0 0%, #1a2870 100%);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.5), 0 4px 16px rgba(26,40,112,0.4);
      display: flex; align-items: center; justify-content: center;
    }
    .hub svg { width: 26px; height: 26px; }

    .spin-btn {
      background: linear-gradient(135deg, #4a70c8, #3358b0);
      color: #fff;
      border: none;
      border-radius: 40px;
      padding: 16px 52px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(74,112,200,0.45);
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
      position: relative;
      z-index: 1;
    }
    .spin-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(74,112,200,0.6);
    }
    .spin-btn:active:not(:disabled) { transform: translateY(0); }
    .spin-btn:disabled {
      background: #b8cce0;
      color: #8aaac8;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Result card */
    .result-card {
      display: none;
      background: rgba(255,255,255,0.88);
      border: 1.5px solid rgba(74,112,200,0.18);
      border-radius: 20px;
      padding: 28px 32px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 40px rgba(74,112,200,0.15);
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.85) translateY(16px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .result-card.visible { display: block; }

    .result-card .badge {
      display: inline-block;
      border-radius: 40px;
      padding: 6px 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .result-card h2 {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 10px;
    }
    .result-card p.desc {
      font-size: 15px;
      color: var(--subtext);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 4px;
    }
    .option-chip {
      background: rgba(74,112,200,0.07);
      border: 1px solid rgba(74,112,200,0.18);
      border-radius: 10px;
      padding: 10px 8px;
      font-size: 12px;
      color: #3a5080;
      line-height: 1.4;
    }
    .option-chip strong {
      display: block;
      color: var(--primary);
      font-size: 11px;
      margin-bottom: 3px;
    }

    /* QR Code upload section */
    .qr-section {
      display: none;
      text-align: center;
      margin-top: 20px;
      padding: 24px 22px 20px;
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(74,112,200,0.18);
      border-radius: 20px;
      width: 100%;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 24px rgba(74,112,200,0.1);
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    .qr-section.visible { display: block; }
    .qr-section h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 5px;
    }
    .qr-section .qr-sub {
      font-size: 13px;
      color: var(--subtext);
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .qr-code-wrap {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      display: inline-block;
      box-shadow: 0 2px 12px rgba(74,112,200,0.15);
    }
    .qr-url-text {
      margin-top: 12px;
      font-size: 11px;
      color: rgba(42,64,160,0.35);
      word-break: break-all;
    }

    /* ── Auto-reset countdown ── */
    .countdown-wrap {
      display: none;
      width: 100%;
      margin-top: 8px;
      text-align: center;
    }
    .countdown-text {
      font-size: 12px;
      color: var(--subtext);
      margin-bottom: 6px;
      letter-spacing: .3px;
    }
    .countdown-track {
      background: rgba(74,112,200,.12);
      border-radius: 8px;
      height: 5px;
      overflow: hidden;
    }
    .countdown-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #9080cc);
      border-radius: 8px;
      width: 100%;
      transition: width 1s linear;
    }

    footer {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(26,48,112,0.35);
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>Spinning <span>Wheel</span></h1>
</header>

<div class="steps-bar">
  <div class="step"><span class="num">1</span> Spin the wheel</div>
  <div class="step"><span class="num">2</span> Receive a category</div>
  <div class="step"><span class="num">3</span> Complete the challenge</div>
  <div class="step"><span class="num">4</span> Upload via QR code</div>
  <div class="step"><span class="num">5</span> Photo goes live</div>
</div>

<div class="main-layout" id="mainLayout">
  <div class="wheel-col">
    <div class="wheel-wrapper" id="wheelWrapper">
    <canvas id="wheel" width="480" height="480"></canvas>
    <div class="pointer"></div>
    <div class="hub">
      <!-- Star icon -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01L12 2z"
              fill="#ffffff" stroke="#ffffff" stroke-width="1"/>
      </svg>
    </div>
  </div>

  <button class="spin-btn" id="spinBtn" onclick="spin()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:8px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    SPIN
  </button>
  </div><!-- /wheel-col -->

  <div class="result-col">
  <div class="result-card" id="resultCard">
    <div class="badge" id="resultBadge"></div>
    <h2 id="resultTitle"></h2>
    <p class="desc" id="resultDesc"></p>
    <div class="options-grid" id="resultOptions"></div>
  </div>

  <!-- QR code — appears after spinning -->
  <div class="qr-section" id="qrSection">
    <h3>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:6px"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Upload your photo
    </h3>
    <p class="qr-sub">Scan with your phone, take the shot,<br>and watch it appear on the gallery screen!</p>
    <div class="qr-code-wrap">
      <img id="qrCanvas" src="QR-Photoupload.png" alt="QR Code Upload" style="width:200px;height:200px;display:block;">
    </div>
    <p class="qr-url-text" id="qrUrlText"></p>
  </div>
  </div>

  <!-- Auto-reset countdown -->
  <div class="countdown-wrap" id="countdownWrap">
    <p class="countdown-text" id="countdownText">Next person in 30s</p>
    <div class="countdown-track">
      <div class="countdown-bar" id="countdownBar"></div>
    </div>
  </div>
  </div><!-- /result-col -->
</div><!-- /main-layout -->

<footer>Discover SAP</footer>

<script>
  // Upload goes through the local server → saved to OneDrive automatically

  // ── Auto-reset ───────────────────────────────────────────────────────────────
  const AUTO_RESET_SECS = 30; // seconds before wheel resets for next person
  let _countdownInterval = null;

  function startAutoReset() {
    clearAutoReset();
    let remaining = AUTO_RESET_SECS;

    const wrap  = document.getElementById('countdownWrap');
    const text  = document.getElementById('countdownText');
    const bar   = document.getElementById('countdownBar');

    wrap.style.display = 'block';
    text.textContent   = `Next person in ${remaining}s`;
    bar.style.width    = '100%';

    // Trigger CSS transition on next frame
    requestAnimationFrame(() => {
      bar.style.transition = `width ${AUTO_RESET_SECS}s linear`;
      bar.style.width = '0%';
    });

    _countdownInterval = setInterval(() => {
      remaining--;
      text.textContent = `Next person in ${remaining}s`;
      if (remaining <= 0) {
        clearAutoReset();
        resetToWheel();
      }
    }, 1000);
  }

  function clearAutoReset() {
    clearInterval(_countdownInterval);
    _countdownInterval = null;
    const wrap = document.getElementById('countdownWrap');
    if (wrap) wrap.style.display = 'none';
    const bar = document.getElementById('countdownBar');
    if (bar) { bar.style.transition = 'none'; bar.style.width = '100%'; }
  }

  function resetToWheel() {
    document.getElementById('resultCard').classList.remove('visible');
    document.getElementById('qrSection').classList.remove('visible');
    document.getElementById('mainLayout').classList.remove('revealed');
    document.getElementById('spinBtn').innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:8px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> SPIN';
  }

  // ── Segment data ────────────────────────────────────────────────────────────
  const base = [
    {
      label: "Community\nSnap",
      color: "#7ab8e8",
      colorAlt: "#4a7fd4",
      textColor: "#1a3070",
      badge: "Community",
      badgeColor: "#4a7fd4",
      title: "Community Snap",
      desc: "Take a selfie with someone you met for the first time today.",
      options: [
        { key: "Example A", text: "Selfie with a person from a different team" },
        { key: "Example B", text: "Photo with someone who has an unexpected hobby" },
        { key: "Example C", text: "You + the colleague who surprised you most" }
      ]
    },
    {
      label: "Showroom\nDiscovery",
      color: "#c8b8e8",
      colorAlt: "#9080cc",
      textColor: "#1a3070",
      badge: "Explore",
      badgeColor: "#7060b8",
      title: "Showroom Discovery",
      desc: "Find and photograph something specific in the Showroom.",
      options: [
        { key: "Example A", text: "Photo with the CPIT robot" },
        { key: "Example B", text: "A product demo screen in action" },
        { key: "Example C", text: "The most interesting thing you discovered today" }
      ]
    },
    {
      label: "Creative\nPose",
      color: "#f0a8a8",
      colorAlt: "#e07878",
      textColor: "#1a3070",
      badge: "Creative",
      badgeColor: "#c85878",
      title: "Creative Pose",
      desc: "Take the most creative or funny group photo you can.",
      options: [
        { key: "Example A", text: "Synchronized jump photo with 3 colleagues" },
        { key: "Example B", text: "Everyone re-enacting a famous SAP moment" },
        { key: "Example C", text: "Power pose in front of the Showroom entrance" }
      ]
    }
  ];

  // Each category appears twice — same colour both times
  const segments = [
    { ...base[0] },
    { ...base[1] },
    { ...base[2] },
    { ...base[0] },
    { ...base[1] },
    { ...base[2] },
  ];

  // ── Canvas setup ────────────────────────────────────────────────────────────
  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const NUM = segments.length;
  const ARC = (2 * Math.PI) / NUM;
  const CX = canvas.width / 2;
  const CY = canvas.height / 2;
  const R  = CX - 12;

  let currentAngle = 0;
  let spinning = false;
  let lastCategory = null;

  function drawWheel(angle) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < NUM; i++) {
      const start = angle + i * ARC;
      const end   = start + ARC;
      const seg   = segments[i];

      // Sector
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.arc(CX, CY, R, start, end);
      ctx.closePath();
      ctx.fillStyle = seg.color;
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.55)";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Alternating lighter inner ring
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.arc(CX, CY, R * 0.94, start + 0.02, end - 0.02);
      ctx.closePath();
      ctx.fillStyle = "rgba(255,255,255,0.07)";
      ctx.fill();

      // Label
      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(start + ARC / 2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = seg.textColor;
      ctx.font = "bold 14px Arial, sans-serif";
      const lines = seg.label.split("\n");
      const lineH = 17;
      const totalH = lines.length * lineH;
      lines.forEach((line, li) => {
        ctx.fillText(line, R * 0.88, -totalH / 2 + li * lineH + lineH / 2);
      });
      ctx.restore();
    }

    // Outer ring
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, 2 * Math.PI);
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.lineWidth = 5;
    ctx.stroke();
  }

  drawWheel(currentAngle);

  // ── Spin logic ──────────────────────────────────────────────────────────────
  function spin() {
    if (spinning) return;
    spinning = true;

    const btn = document.getElementById("spinBtn");
    const card = document.getElementById("resultCard");
    btn.disabled = true;
    card.classList.remove("visible");
    document.getElementById("qrSection").classList.remove("visible");
    document.getElementById("mainLayout").classList.remove("revealed");
    clearAutoReset();
    document.getElementById("wheelWrapper").classList.add("spinning");

    // Pointer is at angle = 0 (pointing right → 3 o'clock → index-based)
    // We want a winning segment to land under the pointer.
    // Prevent the same category from appearing twice in a row.
    let winner;
    let attempts = 0;
    do {
      winner = Math.floor(Math.random() * NUM);
      attempts++;
    } while (segments[winner].title === lastCategory && attempts < 10);
    const fullTurns = 5 + Math.floor(Math.random() * 4); // 5-8 full spins
    const targetAngle = currentAngle
      + fullTurns * 2 * Math.PI
      + (2 * Math.PI - (currentAngle % (2 * Math.PI)))   // normalise
      + (2 * Math.PI - winner * ARC - ARC / 2);          // center winner under pointer

    const duration = 4500;
    const startTime = performance.now();
    const startAngle = currentAngle;

    function easeOut(t) {
      return 1 - Math.pow(1 - t, 4);
    }

    function animate(now) {
      const elapsed = now - startTime;
      const t = Math.min(elapsed / duration, 1);
      currentAngle = startAngle + (targetAngle - startAngle) * easeOut(t);
      drawWheel(currentAngle);

      if (t < 1) {
        requestAnimationFrame(animate);
      } else {
        // Normalize angle to [0, 2π] to prevent floating-point drift over many spins
        currentAngle = targetAngle % (2 * Math.PI);
        lastCategory = segments[winner].title;
        spinning = false;
        btn.disabled = false;
        btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:8px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> SPIN AGAIN';
        document.getElementById("wheelWrapper").classList.remove("spinning");
        showResult(winner);
      }
    }

    requestAnimationFrame(animate);
  }

  function showResult(index) {
    const seg = segments[index];
    const card = document.getElementById("resultCard");

    document.getElementById("resultBadge").textContent = seg.badge;
    document.getElementById("resultBadge").style.background = seg.badgeColor + "33";
    document.getElementById("resultBadge").style.color = seg.badgeColor === "#2d8e8e" ? "#5ecfcf" :
      seg.badgeColor === "#1a6fa8" ? "#5baee8" :
      seg.badgeColor === "#b5327a" ? "#e57bb5" :
      seg.badgeColor === "#6246b0" ? "#a98fe0" :
      seg.badgeColor === "#e67e22" ? "#f0ac6a" : "#6dd98d";
    document.getElementById("resultBadge").style.border = `1px solid ${seg.badgeColor}55`;

    document.getElementById("resultTitle").textContent = seg.title;
    document.getElementById("resultDesc").textContent = seg.desc;

    const grid = document.getElementById("resultOptions");
    grid.innerHTML = seg.options.map(o =>
      `<div class="option-chip"><strong>${o.key}</strong>${o.text}</div>`
    ).join("");

    card.classList.add("visible");
    document.getElementById("mainLayout").classList.add("revealed");
    card.scrollIntoView({ behavior: "smooth", block: "nearest" });

    // Show QR section with dynamically generated SharePoint QR code
    const qrSection = document.getElementById("qrSection");
    qrSection.classList.add("visible");
    // Generate QR code from the SharePoint File Request URL
    document.getElementById("qrUrlText").textContent = '';
    setTimeout(() => qrSection.scrollIntoView({ behavior: "smooth", block: "nearest" }), 200);

    // Start countdown — wheel resets automatically for next person
    startAutoReset();
  }
</script>
</body>
</html>
